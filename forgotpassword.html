<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Stackly</title>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="forgotpassword.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <span class="circle circle1"></span>
        <span class="circle circle2"></span>

        <span class="blob blob1"></span>
        <span class="blob blob2"></span>

        <svg class="wave wave1"
             viewBox="0 0 1440 320"
             preserveAspectRatio="none">

            <path d="M0,160 C220,280 380,40 720,140 C980,220 1180,40 1440,140"
                  fill="none"
                  stroke="rgba(255,255,255,.5)"
                  stroke-width="2"/>

        </svg>

        <svg class="wave wave2"
             viewBox="0 0 1440 320"
             preserveAspectRatio="none">

            <path d="M0,200 C260,60 480,260 720,180 C980,120 1200,260 1440,120"
                  fill="none"
                  stroke="rgba(255,255,255,.45)"
                  stroke-width="2"/>

        </svg>

    </div>

    <!-- Forgot Password Card -->

    <div class="login-card">

        <!-- Logo -->

        <div class="logo">

            <div class="logo-icon">

                <i class="fa-solid fa-layer-group"></i>

            </div>

            <div>

                <h2>STACKLY</h2>

                <p>Enterprise Resource Planning</p>

            </div>

        </div>

        <!-- Heading -->

        <div class="heading">

            <h1>Forgot Password</h1>

            <p>

                Enter your registered email address and we'll send you a verification code.

            </p>

        </div>

        <!-- Form -->

         <form id="forgotForm">

    <div class="form-group">

        <label>Email Address</label>

        <div class="input-box">

            <i class="fa-regular fa-envelope"></i>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email">

        </div>

    </div>

    <div class="or-divider">

        <span>OR</span>

    </div>

    <div class="form-group">

        <label>Phone Number</label>

        <div class="phone-box">

            <div class="country-code">

                <select id="countryCode">
                    <option value="+91" selected>🇮🇳 +91</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+971">🇦🇪 +971</option>
                </select>

            </div>

            <input
                type="tel"
                id="phone"
                maxlength="10"
                placeholder="Enter phone number">

        </div>

    </div>

    <form id="forgotForm">

   ...

   <button class="login-btn" type="submit">
      Send OTP
      <i class="fa-solid fa-paper-plane"></i>
   </button>

   <p id="message"></p>

</form>

<div class="signup">
    Remember your password?
    <a href="loginpage.html">Back to Login</a>
</div>
 
<div class="signup" style="margin-top:12px;">
    Already received OTP?
    <a href="resetpassword.html">Reset Password</a>
</div>
    </div>


    <!-- Popup -->
<div id="popup" class="popup-overlay">
    <div class="popup-box">
        <div class="popup-icon">✔</div>
        <h2 id="popupTitle">Success</h2>
        <p id="popupMessage"></p>
        <button type="button" onclick="closePopup()">OK</button>
    </div>
</div>

    <script src="forgotpassword.js"></script>

</body>

</html>
